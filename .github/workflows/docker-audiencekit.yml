name: Docker image (audiencekit-build)

# Builds the fork's combined branch into an image on GitHub Container Registry:
#   ghcr.io/lwm-luminx/mongooseim:audiencekit-build   (latest build of the branch)
#   ghcr.io/lwm-luminx/mongooseim:sha-<commit>         (each build)
on:
  push:
    branches: [ audiencekit-build ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mongooseim
          tags: |
            type=ref,event=branch
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
